AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Screen Audio Recorder - vLLM 推論サーバー (G4dn + Docker Compose)
  GPU インスタンス (g4dn.xlarge / T4 16GB VRAM) に vLLM をコンテナでデプロイ。
  Whisper large-v3（精度優先）+ LLM（残り VRAM でコンテキスト最大化）。
  SSM State Manager で OS 初期デプロイを自動実行。UserData は不使用。

Parameters:
  ProjectName:
    Type: String
    Default: screen-recorder
    Description: プロジェクト名（リソース名のプレフィックス）

  InstanceType:
    Type: String
    Default: g4dn.xlarge
    AllowedValues:
      - g4dn.xlarge
      - g4dn.2xlarge
    Description: >
      g4dn.xlarge: T4 16GB VRAM, 4 vCPU, 16GB RAM
      g4dn.2xlarge: T4 16GB VRAM, 8 vCPU, 32GB RAM

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 既存 VPC ID

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: インスタンスを配置するサブネット ID

  AllowedCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: >
      API アクセスを許可する CIDR。VPC 内部のみなら VPC CIDR を指定。

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: SSH 接続用キーペア名

  EbsVolumeSize:
    Type: Number
    Default: 80
    MinValue: 50
    Description: EBS (GB)。Docker イメージ + モデルキャッシュ用。

  WhisperModel:
    Type: String
    Default: openai/whisper-large-v3
    Description: Whisper モデル (HuggingFace ID)。精度優先。VRAM ≈ 5GB。

  LlmModel:
    Type: String
    Default: Qwen/Qwen2.5-3B-Instruct
    Description: >
      LLM モデル。残り VRAM ≈ 10GB に収まるモデル。空なら Whisper のみ。

  LlmMaxModelLen:
    Type: Number
    Default: 16384
    Description: LLM 最大コンテキスト長（トークン数）。残り VRAM で最大化。

  HuggingFaceToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: HuggingFace トークン（ゲート付きモデル用）。不要なら空欄。

  UseSpotInstance:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: スポットインスタンス使用（G4dn は ~70% 割引）

Conditions:
  UseSpot: !Equals [!Ref UseSpotInstance, "true"]
  HasLlmModel: !Not [!Equals [!Ref LlmModel, ""]]
  HasHfToken: !Not [!Equals [!Ref HuggingFaceToken, ""]]

Resources:
  # ============================================================
  # IAM ロール（EC2 — SSM Agent 用）
  # ============================================================
  VllmInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-vllm-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  VllmInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref VllmInstanceRole

  # ============================================================
  # セキュリティグループ
  # ============================================================
  VllmSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} vLLM server"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref AllowedCidr
          Description: Whisper API
        - IpProtocol: tcp
          FromPort: 8001
          ToPort: 8001
          CidrIp: !Ref AllowedCidr
          Description: LLM API
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
          Description: SSH
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: All outbound
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vllm-sg"
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # EC2 インスタンス（UserData なし — State Manager でデプロイ）
  # ============================================================
  VllmInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref VllmInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref VllmSecurityGroup
      ImageId: !FindInMap [RegionAmiMap, !Ref "AWS::Region", Ami]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref EbsVolumeSize
            VolumeType: gp3
            Iops: 3000
            Throughput: 125
            DeleteOnTermination: true
      InstanceMarketOptions:
        !If
          - UseSpot
          - MarketType: spot
            SpotOptions:
              SpotInstanceType: persistent
              InstanceInterruptionBehavior: stop
          - !Ref "AWS::NoValue"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vllm"
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # SSM State Manager アソシエーション
  # インスタンス起動時に docker-compose.yml を配置し起動する。
  # restart: unless-stopped により以降の再起動でも自動復帰。
  # ============================================================
  VllmDeployAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-RunShellScript
      AssociationName: !Sub "${ProjectName}-vllm-deploy"
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref VllmInstance
      Parameters:
        commands:
          - !Sub
            - |
              #!/bin/bash
              set -euo pipefail
              
              # 既にコンテナ起動済みならスキップ
              if docker compose -f /opt/vllm/docker-compose.yml ps --status running 2>/dev/null | grep -q "whisper"; then
                echo "vLLM containers already running. Skipping."
                exit 0
              fi

              mkdir -p /opt/vllm
              ${HfTokenExport}

              cat > /opt/vllm/docker-compose.yml << 'EOF'
              services:
                whisper:
                  image: vllm/vllm-openai:latest
                  runtime: nvidia
                  ports:
                    - "8000:8000"
                  volumes:
                    - model-cache:/root/.cache/huggingface
                  environment:
                    - NVIDIA_VISIBLE_DEVICES=all
                    - HF_TOKEN=${HuggingFaceToken}
                  command:
                    - --model
                    - "${WhisperModel}"
                    - --host
                    - "0.0.0.0"
                    - --port
                    - "8000"
                    - --max-model-len
                    - "448"
                    - --gpu-memory-utilization
                    - "0.3"
                    - --dtype
                    - float16
                  deploy:
                    resources:
                      reservations:
                        devices:
                          - driver: nvidia
                            count: 1
                            capabilities: [gpu]
                  restart: unless-stopped
                  healthcheck:
                    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                    interval: 30s
                    timeout: 10s
                    retries: 5
                    start_period: 120s
              EOF

              # LLM サービス追加
              if [ -n "${LlmModelParam}" ]; then
                cat >> /opt/vllm/docker-compose.yml << 'LLMEOF'
                llm:
                  image: vllm/vllm-openai:latest
                  runtime: nvidia
                  ports:
                    - "8001:8001"
                  volumes:
                    - model-cache:/root/.cache/huggingface
                  environment:
                    - NVIDIA_VISIBLE_DEVICES=all
                    - HF_TOKEN=${HuggingFaceToken}
                  command:
                    - --model
                    - "${LlmModelParam}"
                    - --host
                    - "0.0.0.0"
                    - --port
                    - "8001"
                    - --max-model-len
                    - "${LlmMaxModelLenParam}"
                    - --gpu-memory-utilization
                    - "0.65"
                    - --dtype
                    - float16
                  deploy:
                    resources:
                      reservations:
                        devices:
                          - driver: nvidia
                            count: 1
                            capabilities: [gpu]
                  restart: unless-stopped
                  healthcheck:
                    test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
                    interval: 30s
                    timeout: 10s
                    retries: 5
                    start_period: 180s
                  depends_on:
                    whisper:
                      condition: service_healthy
              LLMEOF
              fi

              echo "" >> /opt/vllm/docker-compose.yml
              echo "volumes:" >> /opt/vllm/docker-compose.yml
              echo "  model-cache:" >> /opt/vllm/docker-compose.yml

              cd /opt/vllm
              docker compose pull
              docker compose up -d
            - HfTokenExport: !If
                - HasHfToken
                - !Sub "export HF_TOKEN=${HuggingFaceToken}"
                - "# No HF token"
              LlmModelParam: !Ref LlmModel
              LlmMaxModelLenParam: !Ref LlmMaxModelLen
        workingDirectory:
          - /opt/vllm
      # インスタンス起動時に1回実行（rate 指定なし = 関連付け時に実行）
      ApplyOnlyAtCronInterval: false
      WaitForSuccessTimeoutSeconds: 600

  # ============================================================
  # CloudWatch ロググループ
  # ============================================================
  VllmLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/ec2/${ProjectName}-vllm"
      RetentionInDays: 7

# ============================================================
# AMI マッピング (Deep Learning Base GPU AMI - Ubuntu 22.04)
# NVIDIA Driver + Docker + nvidia-container-toolkit プリインストール
# ============================================================
Mappings:
  RegionAmiMap:
    ap-northeast-1:
      Ami: ami-0b828c1c5ac3f13ee
    us-east-1:
      Ami: ami-0a0c8eebcdd6dcbd0
    us-west-2:
      Ami: ami-0a0c8eebcdd6dcbd0
    ap-southeast-1:
      Ami: ami-0a0c8eebcdd6dcbd0

Outputs:
  InstanceId:
    Description: vLLM EC2 インスタンス ID
    Value: !Ref VllmInstance

  WhisperEndpoint:
    Description: >
      Whisper API。アプリの「文字起こし → vLLM エンドポイント」に設定。
    Value: !Sub "http://${VllmInstance.PrivateIp}:8000/v1/audio/transcriptions"

  LlmEndpoint:
    Description: >
      LLM API。アプリの「LLM → API エンドポイント」に設定。
    Value: !If
      - HasLlmModel
      - !Sub "http://${VllmInstance.PrivateIp}:8001/v1/chat/completions"
      - "N/A (LLM モデル未指定)"

  StateManagerAssociationId:
    Description: SSM State Manager アソシエーション ID
    Value: !Ref VllmDeployAssociation
