AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Screen Audio Recorder - SaaS per-user resources.
  Creates a Bedrock inference profile, an IAM user, and usage monitoring.
  Receives the shared bucket name (from 12_saas-shared.yaml) as a parameter.

Parameters:
  ProjectName:
    Type: String
    Default: screen-recorder
    Description: Project name (prefix for resource names)

  UserName:
    Type: String
    Description: >
      Target user name (e.g. user-a). Used in resource names.

  CreateAccessKey:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to create an IAM access key

  BedrockModelArn:
    Type: String
    Default: "arn:aws:bedrock:ap-northeast-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
    Description: Source model ARN for the inference profile

  EnableTranscribe:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to allow use of Amazon Transcribe

  TranscribeBucketName:
    Type: String
    Description: >
      S3 bucket name created by the shared stack (12_saas-shared).
      Specify the value of the shared stack Output TranscribeBucketName.

  EnableUsageGuard:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to enable the usage guard (disables the key when a limit is exceeded)

  DailyTokenLimit:
    Type: Number
    Default: 500000
    Description: Daily token limit. Access key is auto-disabled when exceeded.

  DailyTranscribeJobLimit:
    Type: Number
    Default: 10
    Description: Daily Transcribe job limit. Access key is auto-disabled when exceeded.

Conditions:
  ShouldCreateAccessKey: !Equals [!Ref CreateAccessKey, "true"]
  ShouldEnableTranscribe: !Equals [!Ref EnableTranscribe, "true"]
  ShouldEnableUsageGuard: !And
    - !Condition ShouldCreateAccessKey
    - !Equals [!Ref EnableUsageGuard, "true"]
  ShouldEnableTranscribeGuard: !And
    - !Condition ShouldEnableTranscribe
    - !Condition ShouldEnableUsageGuard

Resources:
  # ============================================================
  # Bedrock 推論プロファイル（ユーザー単位）
  # ============================================================
  InferenceProfile:
    Type: AWS::Bedrock::ApplicationInferenceProfile
    Properties:
      InferenceProfileName: !Sub "${ProjectName}-${UserName}"
      Description: !Sub "Bedrock inference profile for ${UserName}"
      ModelSource:
        CopyFrom: !Ref BedrockModelArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # ============================================================
  # IAM ユーザー
  # ============================================================
  AppUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${ProjectName}-${UserName}"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # ============================================================
  # IAM ポリシー - Bedrock（推論プロファイル経由のみ許可）
  # ============================================================
  BedrockPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-${UserName}-bedrock"
      Users:
        - !Ref AppUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # 推論プロファイル自体への呼び出しを許可
          - Sid: AllowInferenceProfile
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:Converse
              - bedrock:ConverseStream
            Resource:
              - !GetAtt InferenceProfile.InferenceProfileArn
          # 推論プロファイル経由でのモデルアクセスを許可
          # (Bedrock が内部的にモデルリソースにアクセスする際に必要)
          - Sid: AllowModelViaProfile
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:Converse
              - bedrock:ConverseStream
            Resource:
              - "arn:aws:bedrock:*::foundation-model/*"
            Condition:
              StringEquals:
                bedrock:InferenceProfileArn: !GetAtt InferenceProfile.InferenceProfileArn
          # 推論プロファイルを経由しない直接モデルアクセスを拒否
          - Sid: DenyDirectModelAccess
            Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:Converse
              - bedrock:ConverseStream
            Resource:
              - "arn:aws:bedrock:*::foundation-model/*"
            Condition:
              "Null":
                bedrock:InferenceProfileArn: "true"
          - Sid: BedrockReadOnly
            Effect: Allow
            Action:
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
              - bedrock:ListInferenceProfiles
              - bedrock:GetInferenceProfile
            Resource: "*"

  # ============================================================
  # IAM ポリシー - Amazon Transcribe
  # ============================================================
  TranscribePolicy:
    Type: AWS::IAM::Policy
    Condition: ShouldEnableTranscribe
    Properties:
      PolicyName: !Sub "${ProjectName}-${UserName}-transcribe"
      Users:
        - !Ref AppUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TranscribeBatch
            Effect: Allow
            Action:
              - transcribe:StartTranscriptionJob
              - transcribe:GetTranscriptionJob
              - transcribe:ListTranscriptionJobs
              - transcribe:DeleteTranscriptionJob
            Resource: !Sub "arn:aws:transcribe:*:${AWS::AccountId}:transcription-job/${ProjectName}-*"
          - Sid: TranscribeS3
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource:
              - !Sub "arn:aws:s3:::${TranscribeBucketName}/${UserName}/*"
              - !Sub "arn:aws:s3:::${TranscribeBucketName}/screen-audio-recorder/*"
          - Sid: DenyStreaming
            Effect: Deny
            Action:
              - transcribe:StartStreamTranscription
              - transcribe:StartStreamTranscriptionWebSocket
            Resource: "*"

  # ============================================================
  # IAM アクセスキー
  # ============================================================
  AppUserAccessKey:
    Type: AWS::IAM::AccessKey
    Condition: ShouldCreateAccessKey
    Properties:
      UserName: !Ref AppUser

  AppUserSecret:
    Type: AWS::SecretsManager::Secret
    Condition: ShouldCreateAccessKey
    Properties:
      Name: !Sub "${ProjectName}/${UserName}/credentials"
      Description: !Sub "${UserName} 用 AWS 認証情報"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName
      SecretString: !Sub
        - '{"access_key_id":"${AccessKeyId}","secret_access_key":"${SecretKey}","region":"${AWS::Region}","inference_profile_arn":"${ProfileArn}"}'
        - AccessKeyId: !Ref AppUserAccessKey
          SecretKey: !GetAtt AppUserAccessKey.SecretAccessKey
          ProfileArn: !GetAtt InferenceProfile.InferenceProfileArn

  # ============================================================
  # 使用量ガード: CloudWatch Alarm → SNS → Lambda → キー無効化
  # ============================================================
  UsageGuardTopic:
    Type: AWS::SNS::Topic
    Condition: ShouldEnableUsageGuard
    Properties:
      TopicName: !Sub "${ProjectName}-${UserName}-usage-guard"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  UsageGuardLambdaRole:
    Type: AWS::IAM::Role
    Condition: ShouldEnableUsageGuard
    Properties:
      RoleName: !Sub "${ProjectName}-${UserName}-guard-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DisableAccessKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:UpdateAccessKey
                  - iam:ListAccessKeys
                Resource: !GetAtt AppUser.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  UsageGuardFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldEnableUsageGuard
    Properties:
      FunctionName: !Sub "${ProjectName}-${UserName}-guard"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt UsageGuardLambdaRole.Arn
      Environment:
        Variables:
          TARGET_USER_NAME: !Ref AppUser
      Code:
        ZipFile: |
          import json, logging, os, boto3
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          iam = boto3.client("iam")

          def handler(event, context):
              logger.info("Event: %s", json.dumps(event))
              user_name = os.environ["TARGET_USER_NAME"]

              for record in event.get("Records", []):
                  msg = json.loads(record["Sns"]["Message"])
                  if msg.get("NewStateValue") != "ALARM":
                      logger.info("Not ALARM state, skipping.")
                      return

              resp = iam.list_access_keys(UserName=user_name)
              disabled = []
              for key in resp["AccessKeyMetadata"]:
                  if key["Status"] == "Active":
                      iam.update_access_key(
                          UserName=user_name,
                          AccessKeyId=key["AccessKeyId"],
                          Status="Inactive",
                      )
                      disabled.append(key["AccessKeyId"])
                      logger.info("Disabled key: %s", key["AccessKeyId"])

              return {"disabled_keys": disabled}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  UsageGuardSubscription:
    Type: AWS::SNS::Subscription
    Condition: ShouldEnableUsageGuard
    Properties:
      TopicArn: !Ref UsageGuardTopic
      Protocol: lambda
      Endpoint: !GetAtt UsageGuardFunction.Arn

  UsageGuardLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldEnableUsageGuard
    Properties:
      FunctionName: !Ref UsageGuardFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref UsageGuardTopic

  # CloudWatch Alarm — Bedrock トークン使用量（日次評価窓）
  # 注: Period を 86400 秒（1 日）とし、日次上限の安全弁とする。
  #     残量表示に用いる厳密な当日累計は、使用量集約 Lambda (UsageAggregatorFunction) が
  #     GetMetricData の StartTime を「当日 00:00 UTC」に指定して算出する。
  BedrockInvocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldEnableUsageGuard
    Properties:
      AlarmName: !Sub "${ProjectName}-${UserName}-token-limit"
      AlarmDescription: !Sub "${UserName} の Bedrock トークン使用量が日次上限を超過"
      Namespace: AWS/Bedrock
      MetricName: InputTokenCount
      Dimensions:
        - Name: InferenceProfileArn
          Value: !GetAtt InferenceProfile.InferenceProfileArn
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref DailyTokenLimit
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref UsageGuardTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # ============================================================
  # Transcribe 使用量ガード:
  # CloudTrail → CloudWatch Logs → メトリクスフィルタ → アラーム
  # 全て同一条件 (ShouldEnableTranscribeGuard)
  # バケットは共有スタックで作成済みのため、条件分岐不要
  # ============================================================

  # CloudWatch Logs ロググループ
  TranscribeTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldEnableTranscribeGuard
    Properties:
      LogGroupName: !Sub "/aws/cloudtrail/${ProjectName}-${UserName}"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # CloudTrail → CloudWatch Logs の書き込みロール
  CloudTrailLogsRole:
    Type: AWS::IAM::Role
    Condition: ShouldEnableTranscribeGuard
    Properties:
      RoleName: !Sub "${ProjectName}-${UserName}-trail-logs-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailToLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${TranscribeTrailLogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # CloudTrail（Transcribe API コールを記録）
  # バケットは共有スタックで作成済み＋BucketPolicy 適用済みのため
  # DependsOn 不要、バケット名を直接指定
  TranscribeTrail:
    Type: AWS::CloudTrail::Trail
    Condition: ShouldEnableTranscribeGuard
    Properties:
      TrailName: !Sub "${ProjectName}-${UserName}-transcribe-trail"
      IsLogging: true
      S3BucketName: !Ref TranscribeBucketName
      S3KeyPrefix: cloudtrail
      CloudWatchLogsLogGroupArn: !GetAtt TranscribeTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailLogsRole.Arn
      EventSelectors:
        - ReadWriteType: WriteOnly
          IncludeManagementEvents: true
          DataResources: []
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # メトリクスフィルタ — StartTranscriptionJob のコール数を計上
  TranscribeJobMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: ShouldEnableTranscribeGuard
    DependsOn: TranscribeTrail
    Properties:
      LogGroupName: !Ref TranscribeTrailLogGroup
      FilterPattern: !Sub '{ ($.eventName = "StartTranscriptionJob") && ($.userIdentity.userName = "${ProjectName}-${UserName}") }'
      MetricTransformations:
        - MetricNamespace: !Sub "${ProjectName}/TranscribeUsage"
          MetricName: !Sub "${UserName}-TranscribeJobCount"
          MetricValue: "1"
          DefaultValue: 0

  # CloudWatch Alarm — 日次あたりの Transcribe ジョブ数（日次評価窓）
  # 注: Period を 86400 秒（1 日）とし、日次上限の安全弁とする。
  #     残量表示に用いる厳密な当日累計は、使用量集約 Lambda (UsageAggregatorFunction) が
  #     GetMetricData の StartTime を「当日 00:00 UTC」に指定して算出する。
  TranscribeJobAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldEnableTranscribeGuard
    Properties:
      AlarmName: !Sub "${ProjectName}-${UserName}-transcribe-job-limit"
      AlarmDescription: !Sub "${UserName} の Transcribe ジョブ数が日次上限 (${DailyTranscribeJobLimit}) を超過"
      Namespace: !Sub "${ProjectName}/TranscribeUsage"
      MetricName: !Sub "${UserName}-TranscribeJobCount"
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref DailyTranscribeJobLimit
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref UsageGuardTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # ============================================================
  # 使用量集約 API（案B: 集約 API 方式）
  # API Gateway (AWS_IAM 認可) → Lambda が CloudWatch から当日使用量を集計し、
  # 上限との差分（残量）を JSON で返す。
  # 上限値はアプリに配布せず、Lambda 環境変数（CloudFormation パラメータ由来）に閉じる。
  # 使用量ガード (ShouldEnableUsageGuard) とは独立に常時提供する。
  # ============================================================

  # 集約 Lambda 実行ロール
  UsageAggregatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${UserName}-usage-api-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadUsageMetrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # cloudwatch:GetMetricData はリソースレベルの権限制限に非対応のため、
              # Resource は "*" とする（AWS 仕様上、条件・リソースで絞り込めない）。
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # 使用量集約 Lambda
  UsageAggregatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${UserName}-usage-api"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt UsageAggregatorRole.Arn
      Environment:
        Variables:
          DAILY_TOKEN_LIMIT: !Ref DailyTokenLimit
          DAILY_TRANSCRIBE_JOB_LIMIT: !Ref DailyTranscribeJobLimit
          INFERENCE_PROFILE_ARN: !GetAtt InferenceProfile.InferenceProfileArn
          METRIC_NAMESPACE: !Sub "${ProjectName}/TranscribeUsage"
          TRANSCRIBE_METRIC_NAME: !Sub "${UserName}-TranscribeJobCount"
          ENABLE_TRANSCRIBE: !Ref EnableTranscribe
      Code:
        ZipFile: |
          # 使用量集約 Lambda。
          # 当日 00:00 UTC 〜 現在の Bedrock 入力トークン数と Transcribe ジョブ数を
          # CloudWatch GetMetricData で Sum 集計し、上限との差分（残量）を返す。
          # 注意: 環境変数の一括ダンプ（os.environ / printenv 全出力）は行わない。
          #       ログには使用量・残量の要約のみを出力する。
          import json
          import logging
          import os
          from datetime import datetime, timedelta, timezone

          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          cloudwatch = boto3.client("cloudwatch")


          def _day_start(now):
              # 当日 00:00 UTC
              return now.replace(hour=0, minute=0, second=0, microsecond=0)


          def _next_day_start(now):
              # 翌日 00:00 UTC（リセット日時）
              return _day_start(now) + timedelta(days=1)


          def _sum_metric(namespace, metric_name, dimensions, start, end):
              # 指定メトリクスを当日区間で Sum 集計する。
              resp = cloudwatch.get_metric_data(
                  MetricDataQueries=[
                      {
                          "Id": "usage",
                          "MetricStat": {
                              "Metric": {
                                  "Namespace": namespace,
                                  "MetricName": metric_name,
                                  "Dimensions": dimensions,
                              },
                              # 期間全体を 1 データポイントに集約する。
                              "Period": 86400,
                              "Stat": "Sum",
                          },
                          "ReturnData": True,
                      }
                  ],
                  StartTime=start,
                  EndTime=end,
                  ScanBy="TimestampDescending",
              )
              values = resp["MetricDataResults"][0].get("Values", [])
              return sum(values)


          def handler(event, context):
              now = datetime.now(timezone.utc)
              start = _day_start(now)
              reset_at = _next_day_start(now)

              token_limit = int(os.environ["DAILY_TOKEN_LIMIT"])
              inference_profile_arn = os.environ["INFERENCE_PROFILE_ARN"]

              # Bedrock 入力トークン使用量（当日累計）
              used_tokens = int(
                  _sum_metric(
                      "AWS/Bedrock",
                      "InputTokenCount",
                      [{"Name": "InferenceProfileArn", "Value": inference_profile_arn}],
                      start,
                      end=now,
                  )
              )
              remaining_tokens = max(token_limit - used_tokens, 0)

              # Transcribe ジョブ数（有効時のみ。無効時は各項目 null）
              enable_transcribe = os.environ.get("ENABLE_TRANSCRIBE", "false") == "true"
              if enable_transcribe:
                  job_limit = int(os.environ["DAILY_TRANSCRIBE_JOB_LIMIT"])
                  used_jobs = int(
                      _sum_metric(
                          os.environ["METRIC_NAMESPACE"],
                          os.environ["TRANSCRIBE_METRIC_NAME"],
                          [],
                          start,
                          end=now,
                      )
                  )
                  remaining_jobs = max(job_limit - used_jobs, 0)
              else:
                  job_limit = None
                  used_jobs = None
                  remaining_jobs = None

              body = {
                  "daily_token_limit": token_limit,
                  "used_tokens": used_tokens,
                  "remaining_tokens": remaining_tokens,
                  "daily_transcribe_job_limit": job_limit,
                  "used_transcribe_jobs": used_jobs,
                  "remaining_transcribe_jobs": remaining_jobs,
                  "period_start": start.isoformat(),
                  "reset_at": reset_at.isoformat(),
                  "retrieved_at": now.isoformat(),
              }

              # 要約のみログ出力（認証情報・環境変数全体は出力しない）
              logger.info(
                  "usage summary: tokens used=%s remaining=%s, jobs used=%s remaining=%s",
                  used_tokens, remaining_tokens, used_jobs, remaining_jobs,
              )

              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps(body),
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # 使用量集約 API（REST API, IAM 認可）
  UsageApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${UserName}-usage-api"
      Description: !Sub "${UserName} の使用量（残トークン・残文字起こし回数）を返す API"
      EndpointConfiguration:
        Types:
          - REGIONAL

  # /usage リソース
  UsageApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UsageApi
      ParentId: !GetAtt UsageApi.RootResourceId
      PathPart: usage

  # GET /usage（IAM 認可 + Lambda プロキシ統合）
  UsageApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UsageApi
      ResourceId: !Ref UsageApiResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UsageAggregatorFunction.Arn}/invocations"

  # API デプロイ
  UsageApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: UsageApiMethod
    Properties:
      RestApiId: !Ref UsageApi
      Description: 使用量 API のデプロイ

  # prod ステージ
  UsageApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref UsageApi
      DeploymentId: !Ref UsageApiDeployment
      StageName: prod

  # API Gateway から Lambda を呼び出す許可
  UsageApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UsageAggregatorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UsageApi}/*/GET/usage"

  # アプリ IAM ユーザーへ execute-api:Invoke を付与
  # （当該 API の prod ステージ・GET /usage リソースに限定）
  UsageApiInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-${UserName}-usage-api-invoke"
      Users:
        - !Ref AppUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowInvokeUsageApi
            Effect: Allow
            Action:
              - execute-api:Invoke
            Resource:
              - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UsageApi}/prod/GET/usage"

Outputs:
  InferenceProfileArn:
    Description: Bedrock inference profile ARN
    Value: !GetAtt InferenceProfile.InferenceProfileArn

  InferenceProfileId:
    Description: Inference profile ID
    Value: !GetAtt InferenceProfile.InferenceProfileId

  AppUserArn:
    Description: IAM user ARN
    Value: !GetAtt AppUser.Arn

  AccessKeyId:
    Description: Access key ID
    Condition: ShouldCreateAccessKey
    Value: !Ref AppUserAccessKey

  SecretAccessKey:
    Description: Secret access key (shown only at stack creation)
    Condition: ShouldCreateAccessKey
    Value: !GetAtt AppUserAccessKey.SecretAccessKey

  SecretArn:
    Description: Secrets Manager ARN
    Condition: ShouldCreateAccessKey
    Value: !Ref AppUserSecret

  UsageApiEndpoint:
    Description: 使用量 API のエンドポイント URL（GET でアクセス。IAM/SigV4 認証必須）
    Value: !Sub "https://${UsageApi}.execute-api.${AWS::Region}.amazonaws.com/prod/usage"

  AppConfigSummary:
    Description: Application configuration summary
    Value: !Sub |
      === App config for ${UserName} ===
      [Bedrock]
        - Inference profile: ${InferenceProfile.InferenceProfileArn}
        - Region: ${AWS::Region}
      [Transcribe]
        - S3 bucket: ${TranscribeBucketName}
        - Region: ${AWS::Region}
      [Usage API]
        - Endpoint: https://${UsageApi}.execute-api.${AWS::Region}.amazonaws.com/prod/usage
        - Auth: IAM (SigV4)
        - Bedrock daily token limit: ${DailyTokenLimit}
        - Transcribe daily job limit: ${DailyTranscribeJobLimit}
      [Usage guard]
        - Bedrock daily token limit: ${DailyTokenLimit}
        - Transcribe daily job limit: ${DailyTranscribeJobLimit}
        - On breach: access key auto-disabled
