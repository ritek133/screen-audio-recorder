AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Screen Audio Recorder - SaaS 利用リソース（ユーザー単位）
  ユーザーごとに Bedrock 推論プロファイル + IAM ユーザー + 使用量監視を作成。
  推論プロファイル経由で CloudWatch メトリクスによる個別使用量追跡が可能。

Parameters:
  ProjectName:
    Type: String
    Default: screen-recorder
    Description: プロジェクト名（リソース名のプレフィックス）

  UserName:
    Type: String
    Description: >
      対象ユーザー名（例: user-a）。リソース名に使用。

  CreateAccessKey:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: IAM アクセスキーを作成するか

  BedrockModelArn:
    Type: String
    Default: "arn:aws:bedrock:ap-northeast-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
    Description: >
      推論プロファイルのソースモデル ARN。

  EnableTranscribe:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Amazon Transcribe の利用を許可するか

  TranscribeS3BucketName:
    Type: String
    Default: ""
    Description: Transcribe 用 S3 バケット名。空なら新規作成。

  EnableUsageGuard:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: 使用量ガード（上限超過時にキー無効化）を有効にするか

  MonthlyTokenLimit:
    Type: Number
    Default: 500000
    Description: 月間トークン上限。超過でアクセスキーを自動無効化。

Conditions:
  ShouldCreateAccessKey: !Equals [!Ref CreateAccessKey, "true"]
  ShouldEnableTranscribe: !Equals [!Ref EnableTranscribe, "true"]
  ShouldCreateS3Bucket: !And
    - !Condition ShouldEnableTranscribe
    - !Equals [!Ref TranscribeS3BucketName, ""]
  ShouldEnableUsageGuard: !And
    - !Condition ShouldCreateAccessKey
    - !Equals [!Ref EnableUsageGuard, "true"]

Resources:
  # ============================================================
  # Bedrock 推論プロファイル（ユーザー単位）
  # このプロファイル経由の呼び出しが CloudWatch で個別追跡される
  # ============================================================
  InferenceProfile:
    Type: AWS::Bedrock::ApplicationInferenceProfile
    Properties:
      InferenceProfileName: !Sub "${ProjectName}-${UserName}"
      Description: !Sub "${UserName} 用 Bedrock 推論プロファイル"
      ModelSource:
        CopyFrom: !Ref BedrockModelArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # ============================================================
  # IAM ユーザー
  # ============================================================
  AppUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${ProjectName}-${UserName}"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: User
          Value: !Ref UserName

  # ============================================================
  # IAM ポリシー - Bedrock（推論プロファイル経由のみ許可）
  # ============================================================
  BedrockPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-${UserName}-bedrock"
      Users:
        - !Ref AppUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # 推論プロファイル経由のみ許可
          - Sid: AllowInferenceProfileOnly
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:Converse
              - bedrock:ConverseStream
            Resource:
              - !GetAtt InferenceProfile.InferenceProfileArn
            Condition:
              StringEquals:
                bedrock:InferenceProfileArn: !GetAtt InferenceProfile.InferenceProfileArn
          # 推論プロファイル以外の直接モデル呼び出しを拒否
          - Sid: DenyDirectModelAccess
            Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:Converse
              - bedrock:ConverseStream
            Resource: "*"
            Condition:
              StringNotEquals:
                bedrock:InferenceProfileArn: !GetAtt InferenceProfile.InferenceProfileArn
          # 読み取り（設定画面用）
          - Sid: BedrockReadOnly
            Effect: Allow
            Action:
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
              - bedrock:ListInferenceProfiles
              - bedrock:GetInferenceProfile
            Resource: "*"

  # ============================================================
  # IAM ポリシー - Amazon Transcribe
  # ============================================================
  TranscribePolicy:
    Type: AWS::IAM::Policy
    Condition: ShouldEnableTranscribe
    Properties:
      PolicyName: !Sub "${ProjectName}-${UserName}-transcribe"
      Users:
        - !Ref AppUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TranscribeStreaming
            Effect: Allow
            Action:
              - transcribe:StartStreamTranscription
              - transcribe:StartStreamTranscriptionWebSocket
            Resource: "*"
          - Sid: TranscribeBatch
            Effect: Allow
            Action:
              - transcribe:StartTranscriptionJob
              - transcribe:GetTranscriptionJob
              - transcribe:ListTranscriptionJobs
              - transcribe:DeleteTranscriptionJob
            Resource: !Sub "arn:aws:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/${ProjectName}-${UserName}-*"
          - Sid: TranscribeS3
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource:
              - !If
                - ShouldCreateS3Bucket
                - !Sub "arn:aws:s3:::${TranscribeAudioBucket}/${UserName}/*"
                - !Sub "arn:aws:s3:::${TranscribeS3BucketName}/${UserName}/*"

  # ============================================================
  # S3 バケット（Transcribe 一時保管）
  # ============================================================
  TranscribeAudioBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateS3Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-transcribe-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTempFiles
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ============================================================
  # IAM アクセスキー
  # ============================================================
  AppUserAccessKey:
    Type: AWS::IAM::AccessKey
    Condition: ShouldCreateAccessKey
    Properties:
      UserName: !Ref AppUser

  AppUserSecret:
    Type: AWS::SecretsManager::Secret
    Condition: ShouldCreateAccessKey
    Properties:
      Name: !Sub "${ProjectName}/${UserName}/credentials"
      Description: !Sub "${UserName} 用 AWS 認証情報"
      SecretString: !Sub
        - '{"access_key_id":"${AccessKeyId}","secret_access_key":"${SecretKey}","region":"${AWS::Region}","inference_profile_arn":"${ProfileArn}"}'
        - AccessKeyId: !Ref AppUserAccessKey
          SecretKey: !GetAtt AppUserAccessKey.SecretAccessKey
          ProfileArn: !GetAtt InferenceProfile.InferenceProfileArn

  # ============================================================
  # 使用量ガード: CloudWatch Alarm → SNS → Lambda → キー無効化
  # 推論プロファイル単位のメトリクスで監視
  # ============================================================
  UsageGuardTopic:
    Type: AWS::SNS::Topic
    Condition: ShouldEnableUsageGuard
    Properties:
      TopicName: !Sub "${ProjectName}-${UserName}-usage-guard"

  UsageGuardLambdaRole:
    Type: AWS::IAM::Role
    Condition: ShouldEnableUsageGuard
    Properties:
      RoleName: !Sub "${ProjectName}-${UserName}-guard-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DisableAccessKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:UpdateAccessKey
                  - iam:ListAccessKeys
                Resource: !GetAtt AppUser.Arn

  UsageGuardFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldEnableUsageGuard
    Properties:
      FunctionName: !Sub "${ProjectName}-${UserName}-guard"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt UsageGuardLambdaRole.Arn
      Environment:
        Variables:
          TARGET_USER_NAME: !Ref AppUser
      Code:
        ZipFile: |
          import json, logging, os, boto3
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          iam = boto3.client("iam")

          def handler(event, context):
              logger.info("Event: %s", json.dumps(event))
              user_name = os.environ["TARGET_USER_NAME"]

              for record in event.get("Records", []):
                  msg = json.loads(record["Sns"]["Message"])
                  if msg.get("NewStateValue") != "ALARM":
                      logger.info("Not ALARM state, skipping.")
                      return

              resp = iam.list_access_keys(UserName=user_name)
              disabled = []
              for key in resp["AccessKeyMetadata"]:
                  if key["Status"] == "Active":
                      iam.update_access_key(
                          UserName=user_name,
                          AccessKeyId=key["AccessKeyId"],
                          Status="Inactive",
                      )
                      disabled.append(key["AccessKeyId"])
                      logger.info("Disabled key: %s", key["AccessKeyId"])

              return {"disabled_keys": disabled}

  UsageGuardSubscription:
    Type: AWS::SNS::Subscription
    Condition: ShouldEnableUsageGuard
    Properties:
      TopicArn: !Ref UsageGuardTopic
      Protocol: lambda
      Endpoint: !GetAtt UsageGuardFunction.Arn

  UsageGuardLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldEnableUsageGuard
    Properties:
      FunctionName: !Ref UsageGuardFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref UsageGuardTopic

  # CloudWatch Alarm — 推論プロファイル単位の Invocations 数
  BedrockInvocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldEnableUsageGuard
    Properties:
      AlarmName: !Sub "${ProjectName}-${UserName}-token-limit"
      AlarmDescription: !Sub "${UserName} の Bedrock トークン使用量が上限超過"
      Namespace: AWS/Bedrock
      MetricName: InputTokenCount
      Dimensions:
        - Name: InferenceProfileArn
          Value: !GetAtt InferenceProfile.InferenceProfileArn
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref MonthlyTokenLimit
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref UsageGuardTopic

Outputs:
  InferenceProfileArn:
    Description: >
      Bedrock 推論プロファイル ARN。
      アプリの bedrock_model_id にこの値を設定する。
    Value: !GetAtt InferenceProfile.InferenceProfileArn

  InferenceProfileId:
    Description: 推論プロファイル ID
    Value: !GetAtt InferenceProfile.InferenceProfileId

  AppUserArn:
    Description: IAM ユーザー ARN
    Value: !GetAtt AppUser.Arn

  AccessKeyId:
    Description: アクセスキー ID
    Condition: ShouldCreateAccessKey
    Value: !Ref AppUserAccessKey

  SecretAccessKey:
    Description: シークレットアクセスキー（スタック作成時のみ表示）
    Condition: ShouldCreateAccessKey
    Value: !GetAtt AppUserAccessKey.SecretAccessKey

  SecretArn:
    Description: Secrets Manager ARN
    Condition: ShouldCreateAccessKey
    Value: !Ref AppUserSecret

  TranscribeS3Bucket:
    Description: Transcribe 用 S3 バケット名
    Condition: ShouldCreateS3Bucket
    Value: !Ref TranscribeAudioBucket

  AppConfigSummary:
    Description: アプリ設定サマリー
    Value: !Sub |
      === ${UserName} のアプリ設定 ===
      【Bedrock】
        - バックエンド: AWS Bedrock
        - モデル ID（推論プロファイル）: ${InferenceProfile.InferenceProfileArn} を使用
        - リージョン: ${AWS::Region}
      【Transcribe】
        - バックエンド: AWS Transcribe
        - リージョン: ${AWS::Region}
      【使用量ガード】
        - 月間トークン上限: ${MonthlyTokenLimit}
        - 超過時: アクセスキー自動無効化
