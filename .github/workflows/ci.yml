# CI ワークフロー
# PR（main 向け）で自動テストとセキュリティチェックを実行する。
# ジョブ名（test / security）はブランチ保護のステータスチェック名と一致させること。
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # テストジョブ: OS 非依存のロジックテストのため ubuntu-latest で実行する
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.10 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 依存関係をインストール（開発依存を含む）
        run: pip install -e ".[dev]"

      - name: pytest を実行
        run: pytest

  # セキュリティジョブ: test と並列実行される独立ジョブ。
  # gitleaks によるシークレットスキャンと、カスタムチェック（後続タスクで追加）を実行する。
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト（全履歴）
        uses: actions/checkout@v4
        with:
          # gitleaks が PR 差分を正しく判定できるよう全履歴を取得する
          fetch-depth: 0

      - name: gitleaks でシークレットをスキャン
        # PR の差分コミットのみをスキャンする（gitleaks のデフォルト動作）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: カスタムセキュリティチェック（個人情報・ローカルパス検出）
        # gitleaks がカバーしないプロジェクト固有のパターンを PR 差分に対して検出する。
        # 検出時は exit 1 でジョブを失敗させる（SEC-2, SEC-5, SEC-6）。
        env:
          # PR のベースブランチ（例: main）を差分の基準に渡す
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          bash scripts/security-check.sh
